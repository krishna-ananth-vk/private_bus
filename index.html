<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kerala Private Bus</title>
    <meta name="description" content="Experience the nostalgia of Kerala's Private Buses with their authentic sounds and songs." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://privatebus.online/" />
    <meta property="og:title" content="Kerala Private Bus" />
    <meta property="og:description" content="Experience the nostalgia of Kerala's Private Buses with their authentic sounds and songs." />
    <meta property="og:image" content="https://privatebus.online/preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="450" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://privatebus.online/" />
    <meta property="twitter:title" content="Kerala Private Bus" />
    <meta property="twitter:description" content="Experience the nostalgia of Kerala's Private Buses with their authentic sounds and songs." />
    <meta property="twitter:image" content="https://privatebus.online/preview.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chilanka&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Background -->
    <div class="hero-bg">
      <div class="hero-overlay"></div>
    </div>

    <!-- YouTube Hidden Player -->
    <div id="player-container">
      <div id="youtube-player"></div>
    </div>

    <main>


      <!-- Route Info -->
      <div class="route-info-container">
        <span class="route-label">ROUTE</span>
        <div class="route-places">
          <span id="route-start">Palakkad</span>
          <span class="route-arrow">⟶</span>
          <span id="route-end">Shornur</span>
        </div>
      </div>

      <!-- Player Component -->
      <div class="player-wrapper">
        <!-- Logo or Title -->
        <h1 class="main-title" id="main-title">PRIVATE BUS</h1>
        <p class="sub-title">Kerala's finest high-speed bangers</p>

        <!-- Player Card -->
        <div class="glass-card">
          <!-- Album Art -->
          <div class="album-art-container">
            <div class="album-art" id="album-art-wrapper">
              <img src="/bg.png" alt="Album Art" id="album-art-img" />
            </div>
            <div class="album-center-hole"></div>
          </div>

          <!-- Track Info -->
          <div class="track-info">
            <p class="track-title" id="track-title">Loading track...</p>
            <p class="track-artist" id="track-artist">Connecting to YouTube...</p>

            <!-- Progress Bar -->
            <div class="progress-container" id="progress-container">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
              </div>
              <div class="time-info">
                <span id="time-current">0:00</span> / <span id="time-total">0:00</span>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="controls">
            <button aria-label="Previous track" id="btn-prev" class="control-btn icon-btn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
            </button>
            <button aria-label="Play/Pause" id="btn-play-pause" class="control-btn play-btn" disabled>
              <!-- Play Icon Default -->
              <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
              <!-- Pause Icon Hidden -->
              <svg id="icon-pause" style="display:none;" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
            </button>
            <button aria-label="Next track" id="btn-next" class="control-btn icon-btn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"></path></svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Bus Selection Board -->
      <div class="bus-board-container">
        <div class="bus-board-actions">
          <div class="bus-selector-wrapper">
            <div class="bus-board-current">
              <svg class="bus-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-1.38 0-2.5-1.12-2.5-2.5S6.12 12 7.5 12 10 13.12 10 14.5 8.88 17 7.5 17zm9 0c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM6 10V6h12v4H6z"></path></svg>
            </div>
            <div class="bus-list" id="bus-list">
              <!-- Dynamically populated via JS -->
            </div>
          </div>
          <!-- Honk Button -->
          <button id="btn-honk" class="btn-honk" aria-label="Honk Horn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Fullscreen Button -->
      <button id="btn-fullscreen" class="btn-fullscreen icon-btn" aria-label="Toggle Fullscreen">
        <svg id="icon-fs-enter" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
        <svg id="icon-fs-exit" style="display:none;" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
        </svg>
      </button>
    </main>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
